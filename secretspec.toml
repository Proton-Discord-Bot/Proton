[project]
name = "Proton"
revision = "1.0"

# Extend configurations from subdirectories
# extends = [ "subdir1", "subdir2" ]

[profiles.default]
TOKEN = { description = "Discord bot token", required = true }
DISCORD_APPLICATION_ID = { description = "Discord application id, used to register commands", required = true }
# Optional: scope command registration to a single guild for instant updates while developing.
DISCORD_GUILD_ID = { description = "Guild id to register commands to (omit for global)", required = false }
# Optional: path to the SQLite file; defaults to ./database.sqlite
DATABASE_PATH = { description = "SQLite database file path", required = false }

[profiles.development]
# Development profile inherits all secrets from default profile
# Only define secrets here that need different values or settings than default
# DATABASE_URL = { default = "sqlite:///dev.db" }
#
# New secrets
# REDIS_URL = { description = "Redis connection URL for caching", required = false, default = "redis://localhost:6379" }
